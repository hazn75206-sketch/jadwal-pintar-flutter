name: Flutter CI Build (fast)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

jobs:
  build-user:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (wajib untuk AGP 9.x)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install Android platform 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "platform-tools" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Generate google-services.json dari Secrets
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Validasi client Firebase (gagal cepat bila package tak cocok)
        run: |
          python3 - <<'EOF'
          import json, sys
          data = json.load(open('android/app/google-services.json'))
          found = {c['client_info']['android_client_info']['package_name'] for c in data.get('client', [])}
          print('Package di google-services.json:', sorted(found))
          need = {'com.jadwalpintar.app', 'com.jadwalpintar.admin'}
          missing = need - found
          if missing:
              print('GAGAL: client tidak ditemukan untuk:', sorted(missing))
              sys.exit(1)
          print('OK: kedua client flavor ditemukan.')
          EOF

      - name: Siapkan keystore signing (dari Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze (gagal bila ada error Dart)
        run: flutter analyze

      - name: Build APK user (release di-sign)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --flavor user --target lib/main_user.dart --build-number 3 --build-name 3.0.0

      - name: Pastikan values Firebase ter-generate (user)
        run: |
          find build android/app/build -path "*google-services*values.xml" 2>/dev/null
          test -n "$(find build android/app/build -path "*google-services/userRelease/values.xml" 2>/dev/null)"

      - name: Verifikasi tanda tangan APK user
        run: |
          APKSIGNER=$(echo "$ANDROID_HOME"/build-tools/*/apksigner | tr ' ' '\n' | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-user-release.apk | grep -E "Signer|SHA-256|SHA-1" | head -n 6

      - name: Upload APK user
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jadwal-pintar-flutter-user-apk
          path: build/app/outputs/flutter-apk/app-user-release.apk
          if-no-files-found: warn

  build-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (wajib untuk AGP 9.x)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install Android platform 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "platform-tools" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Generate google-services.json dari Secrets
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Validasi client Firebase (gagal cepat bila package tak cocok)
        run: |
          python3 - <<'EOF'
          import json, sys
          data = json.load(open('android/app/google-services.json'))
          found = {c['client_info']['android_client_info']['package_name'] for c in data.get('client', [])}
          print('Package di google-services.json:', sorted(found))
          need = {'com.jadwalpintar.app', 'com.jadwalpintar.admin'}
          missing = need - found
          if missing:
              print('GAGAL: client tidak ditemukan untuk:', sorted(missing))
              sys.exit(1)
          print('OK: kedua client flavor ditemukan.')
          EOF

      - name: Siapkan keystore signing (dari Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK admin (release di-sign)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --flavor admin --target lib/main_admin.dart --build-number 3 --build-name 3.0.0

      - name: Pastikan values Firebase ter-generate (admin)
        run: |
          find build android/app/build -path "*google-services*values.xml" 2>/dev/null
          test -n "$(find build android/app/build -path "*google-services/adminRelease/values.xml" 2>/dev/null)"

      - name: Verifikasi tanda tangan APK admin
        run: |
          APKSIGNER=$(echo "$ANDROID_HOME"/build-tools/*/apksigner | tr ' ' '\n' | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-admin-release.apk | grep -E "Signer|SHA-256|SHA-1" | head -n 6

      - name: Upload APK admin
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jadwal-pintar-flutter-admin-apk
          path: build/app/outputs/flutter-apk/app-admin-release.apk
          if-no-files-found: warn

  package-zip:
    runs-on: ubuntu-latest
    needs: [build-user, build-admin]
    permissions:
      actions: write
    steps:
      - name: Unduh kedua APK
        uses: actions/download-artifact@v4
        with:
          path: apks

      - name: Bungkus jadi 1 ZIP (user + admin)
        run: |
          ls -R apks
          mkdir -p rilis
          cp apks/jadwal-pintar-flutter-user-apk/*.apk "rilis/jadwal-pintar-user-v3.0.0+3.apk"
          cp apks/jadwal-pintar-flutter-admin-apk/*.apk "rilis/jadwal-pintar-admin-v3.0.0+3.apk"
          zip -j jadwal-pintar-apk.zip rilis/*.apk
          unzip -l jadwal-pintar-apk.zip

      - name: Upload ZIP gabungan
        uses: actions/upload-artifact@v4
        with:
          name: jadwal-pintar-apk
          path: jadwal-pintar-apk.zip

      - name: Hapus artifact satuan (sisakan 1 ZIP)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IDS=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" -q '.artifacts[] | select(.name != "jadwal-pintar-apk") | .id')
          for ID in $IDS; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$ID" && echo "hapus artifact $ID"
          done
