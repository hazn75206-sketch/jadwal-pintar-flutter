name: Flutter CI Build (fast)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

jobs:
  build-user:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (wajib untuk AGP 9.x)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install Android platform 36 (lewati bila sudah ada)
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "platform-tools" || true
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          else
            echo "android-36 sudah ada, lewati."
          fi

      - name: Generate google-services.json dari Secrets
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Validasi client Firebase (gagal cepat bila package tak cocok)
        run: |
          python3 - <<'EOF'
          import json, sys
          data = json.load(open('android/app/google-services.json'))
          found = {c['client_info']['android_client_info']['package_name'] for c in data.get('client', [])}
          print('Package di google-services.json:', sorted(found))
          need = {'com.jadwalpintar.app', 'com.jadwalpintar.admin'}
          missing = need - found
          if missing:
              print('GAGAL: client tidak ditemukan untuk:', sorted(missing))
              sys.exit(1)
          print('OK: kedua client flavor ditemukan.')
          EOF

      - name: Siapkan keystore signing (dari Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze (gagal bila ada error Dart)
        run: flutter analyze

      - name: Build APK user (release di-sign)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --flavor user --target lib/main_user.dart --build-number 3 --build-name 3.0.0

      - name: Pastikan values Firebase ada di APK (user)
        run: |
          python3 - <<'EOF'
          import sys, zipfile
          z = zipfile.ZipFile('build/app/outputs/flutter-apk/app-user-release.apk')
          arsc = z.read('resources.arsc')
          need = [b'google_app_id', b'firebase_database_url']
          missing = [k.decode() for k in need if k not in arsc]
          if missing:
              print('GAGAL: tidak ada di APK:', missing)
              sys.exit(1)
          print('OK: values Firebase ada di APK user.')
          EOF

      - name: Verifikasi tanda tangan APK user
        run: |
          APKSIGNER=$(echo "$ANDROID_HOME"/build-tools/*/apksigner | tr ' ' '\n' | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-user-release.apk | grep -E "Signer|SHA-256|SHA-1" | head -n 6

      - name: Upload APK user
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jadwal-pintar-flutter-user-apk
          path: build/app/outputs/flutter-apk/app-user-release.apk
          if-no-files-found: warn

  build-admin:
