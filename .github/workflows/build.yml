name: Flutter CI Build (fast)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configureondemand=true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show CPU info (semua core dipakai)
        run: |
          echo "nproc=$(nproc)"
          lscpu | head -n 20

      - name: Set up JDK 17 (wajib untuk AGP 9.x)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Setup Gradle cache (biar build berikutnya cepat)
        uses: gradle/actions/setup-gradle@v3

      - name: Tulis flutter.sdk ke local.properties (jamin includeBuild Gradle)
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          cat android/local.properties

      - name: Diagnostik SDK Flutter (isi includeBuild)
        run: |
          flutter --version
          ls -la "$FLUTTER_ROOT/packages/flutter_tools/gradle"
          du -sh "$FLUTTER_ROOT"

      - name: Install Android platform 36
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "platform-tools" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Generate google-services.json dari Secrets
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          ls -la android/app/google-services.json

      - name: Siapkan keystore signing (dari Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          ls -la "$RUNNER_TEMP/release.jks"

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze (gagal bila ada error Dart)
        run: flutter analyze

      - name: Build APK user + admin (pakai SEMUA core, release di-sign)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --flavor user --target lib/main_user.dart --build-number 3 --build-name 3.0.0
          flutter build apk --release --flavor admin --target lib/main_admin.dart --build-number 3 --build-name 3.0.0

      - name: Verifikasi tanda tangan APK release
        run: |
          APKSIGNER=$(echo "$ANDROID_HOME"/build-tools/*/apksigner | tr ' ' '\n' | sort -V | tail -n 1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-user-release.apk | grep -E "Signer|SHA-256|SHA-1" | head -n 6
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-admin-release.apk | grep -E "Signer|SHA-256|SHA-1" | head -n 6

      - name: Upload APK user
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jadwal-pintar-flutter-user-apk
          path: build/app/outputs/flutter-apk/app-user-release.apk
          if-no-files-found: warn

      - name: Upload APK admin
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jadwal-pintar-flutter-admin-apk
          path: build/app/outputs/flutter-apk/app-admin-release.apk
          if-no-files-found: warn
